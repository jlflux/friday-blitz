.frow{display:flex;align-items:center;gap:8px;background:#121a3a;padding:8px;box-shadow:3px 3px 0 #000;font-weight:700;font-size:14px;min-height:28px;color:#fff;font-family:inherit;border:0;text-align:left;width:100%;box-sizing:border-box}
button.frow{cursor:pointer;min-height:44px}button.frow:active{background:#2a3a8c}
.frow.me{background:#2a3a8c;box-shadow:inset 4px 0 0 #ffd23f,3px 3px 0 #000}.frow.dim{color:#7a86b8}
.frow .tn2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow em,.tn2 em{font-style:normal;color:#9aa6d8;font-weight:700;font-size:.85em}
.frow b{white-space:nowrap}.frow .wk{color:#c9d6ff;font-weight:900;min-width:34px;font-size:12px}.frow .btn.xs{min-width:36px;min-height:36px}
b.w{color:#4dff6a}b.l{color:#ff6a5a}

.stars{color:#ffd23f;letter-spacing:-.05em}
.fhdr{display:flex;gap:10px;align-items:center;background:#121a3a;border-left:8px solid var(--p);border-right:8px solid var(--s);padding:8px;box-shadow:4px 4px 0 #000}

.fbody{display:flex;flex-direction:column;gap:6px;min-height:120px}

.ftbl{display:flex;flex-direction:column;gap:3px}.ftbl .th,.ftbl .tr{display:grid;grid-template-columns:24px 1fr 46px 46px 64px;gap:6px;align-items:center;padding:6px;font-weight:700;font-size:13px}
.ftbl .th{color:#9aa6d8;font-weight:900;font-size:11px}.ftbl .tr{background:#121a3a}.ftbl .tr.me{background:#2a3a8c;box-shadow:inset 4px 0 0 #ffd23f}.ftbl .tr.cut{border-bottom:3px dashed #ffd23f}
.ftbl .tn2{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fnote{font-size:12px;color:#9aa6d8;font-weight:700}
.rinfo{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:#c9d6ff;font-weight:700}.rinfo .pot{color:#ffd23f}.inj{color:#ff6a5a!important;font-weight:900}
.btn.xs2{padding:4px 8px;min-height:36px;min-width:40px;font-size:13px}
.ffunds{font-weight:900;font-size:18px;text-align:center;padding:6px}.ffunds b{color:#4dff6a}
.fupg{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#121a3a;padding:8px;box-shadow:3px 3px 0 #000}.fupg .lvl{color:#ffd23f;letter-spacing:.1em}
.fset{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:8px}
.fchamp{text-align:center;font-weight:900;color:#ffd23f;font-size:18px;padding:6px}.fbig{text-align:center;font-weight:900;font-size:48px;color:#ffd23f;text-shadow:3px 3px 0 #e8331c}
#tune{position:absolute;right:0;top:120px;max-height:60vh;overflow:auto;background:rgba(0,0,0,.85);padding:8px;font-size:12px;display:flex;flex-direction:column;gap:4px;z-index:5}
#tune label{display:flex;justify-content:space-between;gap:8px}#tune input{width:70px}
