<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="game-layout" content="design=390x844;min=320x480;critical=390x600">
<title>Friday Night Blitz</title>
<link rel="icon" type="image/png" href="%%FAVICON%%">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070f;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;color:#fff}
:root{--u:1}
body.cjk{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Hiragino Sans GB","Courier New",monospace}
#game{position:fixed;inset:0;touch-action:none}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui button,#ui input,#ui .panel,#ui .scr,#ui #tune{pointer-events:auto}
.hidden{display:none!important}
.btn{font:inherit;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:#2a3a8c;border:0;border-radius:0;padding:10px 14px;min-height:44px;min-width:44px;cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.28),0 0 0 3px #05070f,4px 4px 0 3px #05070f;text-shadow:2px 2px 0 #000;font-size:clamp(14px,calc(15px*var(--u)),20px)}
.btn:active{transform:translate(2px,2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.4),0 0 0 3px #05070f,2px 2px 0 3px #05070f}
.btn.pri{background:#e8331c}.btn.sec{background:#33405a}.btn.sec2{background:#2a3a8c}.btn.on{background:#ffd23f;color:#141414;text-shadow:none}
.btn.big{font-size:clamp(20px,calc(24px*var(--u)),30px);padding:12px 22px;min-height:52px}
.btn.sm{padding:6px 10px;min-height:40px;font-size:clamp(13px,calc(14px*var(--u)),18px)}
.btn.xs{padding:0;min-height:34px;min-width:34px;font-size:18px}
.btn.icon{min-width:44px;min-height:44px;padding:0;font-size:18px;background:#141a33}
.btn.icon.off{opacity:.45}
.btn.ghost{background:transparent;box-shadow:none;text-decoration:underline;min-height:44px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));box-sizing:border-box;touch-action:pan-y}
.scr.dim{background:rgba(4,6,16,.82);justify-content:center;gap:16px}
#title{justify-content:space-between;background:linear-gradient(rgba(5,7,20,.55),rgba(5,7,20,.05) 45%,rgba(5,7,20,.7))}
#logo{width:min(92vw,560px);height:auto;image-rendering:pixelated;margin-top:4vh;filter:drop-shadow(0 0 18px rgba(255,180,60,.35))}
.tag{font-weight:900;letter-spacing:.16em;text-align:center;background:rgba(5,7,15,.8);padding:4px 10px;font-size:clamp(12px,calc(14px*var(--u)),18px);color:#c9d6ff;text-shadow:2px 2px 0 #000;margin-top:6px}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:4vh}
.tbtns .btn.big{font-size:clamp(26px,calc(32px*var(--u)),40px);padding:14px 46px;animation:pulse 1.2s steps(2) infinite}
@keyframes pulse{50%{background:#ff5a2c}}
.rec{font-weight:900;text-shadow:2px 2px 0 #000;font-size:15px;min-height:18px}
.langs{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;gap:6px}
.langs .btn{min-height:36px;font-size:13px}
#setup,#editor{background:#0a0f26;gap:10px}
.ph{font-weight:900;font-size:clamp(22px,calc(28px*var(--u)),34px);letter-spacing:.1em;text-shadow:3px 3px 0 #e8331c,5px 5px 0 #000}
#cards{display:flex;flex-direction:column;gap:6px;width:100%;max-width:520px}
.tcard{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:6px 10px;align-items:center;background:#121a3a;border-left:8px solid var(--p);border-right:8px solid var(--s);padding:10px;box-shadow:4px 4px 0 #000}
.tcard .pv{width:108px;height:54px;image-rendering:pixelated;grid-row:1 / span 2}
.side{font-size:12px;color:#ffd23f;font-weight:900;letter-spacing:.1em}.tn{font-size:clamp(17px,calc(20px*var(--u)),24px);font-weight:900;text-transform:uppercase}.tm2{font-size:13px;color:#b8c2e8;font-weight:700;text-transform:uppercase}
.tnav{display:flex;gap:8px;grid-column:2}
.vs{text-align:center;font-weight:900;font-size:20px;color:#ffd23f;text-shadow:2px 2px 0 #000}
.opt{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px}.ol{font-weight:900;font-size:13px;color:#b8c2e8;text-transform:uppercase;letter-spacing:.08em}
.seg{display:flex;gap:8px;flex-wrap:wrap}.stepper{display:flex;align-items:center;gap:12px;font-weight:900;font-size:18px}
.row2{display:flex;gap:12px;justify-content:center;width:100%;max-width:520px;margin-top:6px}
.etabs{display:flex;gap:8px;width:100%;max-width:560px;align-items:center;position:sticky;top:0;background:#0a0f26;padding:4px 0 8px;z-index:2}
.tab{font:inherit;font-weight:900;color:#b8c2e8;background:#141a33;border:0;padding:10px 14px;min-height:44px;box-shadow:0 3px 0 #000;font-size:15px}
.tab.on{color:#141414;background:#ffd23f}#bDone{margin-left:auto}
#ebody{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;padding-bottom:30px}
.ehead{display:flex;gap:12px;align-items:center;background:#121a3a;padding:8px;box-shadow:4px 4px 0 #000}.pv.big{width:144px;height:72px;image-rendering:pixelated}
.fld{display:flex;flex-direction:column;gap:6px}.fld>span{font-weight:900;font-size:13px;color:#b8c2e8;text-transform:uppercase;letter-spacing:.06em}
.fld input[type=text],.rnum,.rname{font:inherit;font-weight:900;font-size:17px;background:#05070f;color:#fff;border:3px solid #33405a;padding:8px;min-height:40px;box-sizing:border-box;text-transform:uppercase}
.swatches{display:flex;flex-wrap:wrap;gap:6px}.sw{width:34px;height:34px;border:3px solid #05070f;box-shadow:2px 2px 0 #000;cursor:pointer;padding:0}.sw.on{outline:3px solid #ffd23f}
.cpick{width:44px;height:34px;padding:0;border:3px solid #05070f;background:#05070f}
.roster{display:flex;flex-direction:column;gap:8px}.rrow{background:#121a3a;padding:8px;box-shadow:3px 3px 0 #000;display:flex;flex-direction:column;gap:6px}
.rtop{display:flex;gap:6px;align-items:center}.rpos{font-weight:900;color:#ffd23f;width:30px}.hash{font-weight:900;color:#b8c2e8}.rnum{width:52px;text-align:center}.rname{flex:1;min-width:0}
.rbot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.rst{display:grid;grid-template-columns:34px 1fr 34px;grid-template-rows:auto auto 4px;align-items:center;gap:2px 2px;background:#0a0f26;padding:4px}.rst .rl{grid-column:1 / span 3;text-align:center}
.rl{font-size:12px;font-weight:900;color:#b8c2e8}.rv{text-align:center;font-weight:900;font-size:17px}.rbar{grid-column:1 / span 3;height:4px;background:linear-gradient(90deg,#ffd23f var(--v),#222a48 var(--v))}
.units{position:sticky;top:56px;background:#0a0f26;padding:4px 0;z-index:1}
#hud{position:absolute;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 8px 0;display:grid;grid-template-columns:44px 1fr 44px;grid-template-rows:auto auto;gap:6px;align-items:start}
#board{display:grid;grid-template-columns:1fr auto 1fr;background:#05070f;box-shadow:0 0 0 3px #05070f,4px 4px 0 3px #000;min-width:0}
.tm{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;font-weight:900;gap:6px;min-width:0}
.tm .ab{font-size:clamp(14px,calc(16px*var(--u)),20px);overflow:hidden;white-space:nowrap}.tm .sc{font-size:clamp(22px,calc(26px*var(--u)),32px);font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.tm.poss .ab:after{content:"●";color:#ffd23f;margin-left:3px;font-size:.7em;vertical-align:middle}
.clk{background:#141414;color:#ffd23f;text-align:center;padding:2px 10px;font-weight:900;line-height:1.1}.clk #qtr{font-size:12px;color:#c9d6ff}
#clock{font-size:clamp(18px,calc(20px*var(--u)),26px);font-variant-numeric:tabular-nums}#clock.red{color:#ff4a3a}
#dd{grid-column:1 / span 3;justify-self:center;background:rgba(5,7,15,.85);padding:4px 10px;font-weight:900;font-size:clamp(14px,calc(15px*var(--u)),19px);box-shadow:3px 3px 0 #000;white-space:nowrap}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-weight:900;font-size:clamp(22px,calc(26px*var(--u)),36px);text-shadow:3px 3px 0 #000,-2px -2px 0 #000;opacity:0;transform:scale(.6);padding:0 12px}
#banner.show{opacity:1;transform:scale(1);transition:transform .18s steps(3),opacity .1s}
#banner.big{font-size:clamp(30px,calc(40px*var(--u)),56px);letter-spacing:.04em}
#hint{position:absolute;left:12px;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 76px);text-align:center;font-weight:900;font-size:clamp(14px,calc(15px*var(--u)),19px);text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .2s}
#hint.show{opacity:1}
#ticker{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 96px);transform:translateX(-50%);max-width:calc(100vw - 24px);box-sizing:border-box;background:rgba(5,7,15,.9);border-left:6px solid #ffd23f;padding:5px 10px;font-weight:900;font-size:clamp(12px,calc(13px*var(--u)),16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:3px 3px 0 #000;opacity:0}
#ticker.show{opacity:1;transition:opacity .15s}
.tlogo{display:flex;flex-direction:column;align-items:center}
#dock{position:absolute;left:0;right:0;bottom:0;padding:0 10px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#dockL,#dockR{display:flex;gap:8px}
.btn.rk{min-width:52px;min-height:52px;font-size:22px;padding:0}.btn.rk.open{background:#1fa83a}.btn.rk.mid{background:#c99a12}.btn.rk.cov{background:#b5281c}
.btn.act{min-width:96px;min-height:64px;font-size:clamp(18px,calc(20px*var(--u)),24px);background:#e8331c}.btn.act.sec{background:#33405a;min-width:84px}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border:4px solid rgba(255,255,255,.35);border-radius:50%;pointer-events:none;box-sizing:border-box}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(255,210,63,.75);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(0,0,0,.5)}
.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(96vw,560px);background:rgba(8,11,30,.94);box-shadow:0 0 0 3px #ffd23f,0 0 0 6px #05070f,6px 6px 0 6px #000;padding:10px;box-sizing:border-box}
.pct{font-weight:900;font-size:clamp(18px,calc(20px*var(--u)),26px);color:#ffd23f;text-shadow:2px 2px 0 #000;text-align:center}.pcs{text-align:center;font-weight:900;font-size:14px;color:#c9d6ff;margin:2px 0 8px}
.pcg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.pcg.def{grid-template-columns:1fr 1fr}
.pcard{font:inherit;font-weight:900;color:#fff;background:#1a2550;border:0;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.18),3px 3px 0 #000;min-height:44px;font-size:clamp(12px,calc(13px*var(--u)),16px);text-transform:uppercase;text-align:center;line-height:1.1}
.pcard:active{background:#ffd23f;color:#141414}.pcv{width:100%;max-width:120px;aspect-ratio:40/26;image-rendering:pixelated}
.pcr{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#meter{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 20px);width:min(90vw,460px);text-align:center;pointer-events:none}
.mt{font-weight:900;font-size:clamp(20px,calc(24px*var(--u)),30px);color:#ffd23f;text-shadow:3px 3px 0 #000;animation:pulse2 .5s steps(2) infinite}@keyframes pulse2{50%{color:#fff}}
#mbar{position:relative;height:30px;background:#5a1410;box-shadow:0 0 0 3px #05070f,4px 4px 0 3px #000;margin:10px 0}#mbar.far{background:#3a0a08}
#mwin{position:absolute;top:0;bottom:0;background:#1fa83a}#mneedle{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;background:#fff;box-shadow:0 0 0 2px #000}
.mh{font-weight:900;font-size:14px;text-shadow:2px 2px 0 #000}
#end{position:absolute;inset:0;pointer-events:auto}#end .dim2{position:absolute;inset:0;background:rgba(4,6,18,.62)}
#end .rays{position:absolute;left:50%;top:40%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(255,210,63,.13) 0 10deg,transparent 10deg 20deg);animation:spin 18s linear infinite;opacity:0}
#end.in .rays{opacity:1;transition:opacity .4s}@keyframes spin{to{transform:rotate(360deg)}}
.ecwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:max(12px,calc(20px*var(--u)));padding:16px;box-sizing:border-box}
.ec-copy-panel{width:min(calc(360px*max(1,var(--u))),calc(100vw - 32px));background:#0d1330;box-shadow:0 0 0 4px #ffd23f,0 0 0 8px #05070f,8px 8px 0 8px #000;padding:16px 16px 18px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:max(10px,calc(10px*var(--u)))}
#end.in .ec-copy-panel{animation:pop .35s steps(4)}@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.eid{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:13px;color:#c9d6ff;letter-spacing:.08em;text-transform:uppercase}.eid img{width:24px;height:24px;image-rendering:pixelated}
.et{font-weight:900;font-size:clamp(30px,calc(40px*var(--u)),52px);color:#ffd23f;text-shadow:3px 3px 0 #e8331c,5px 5px 0 #000;line-height:1.05}
.escore{font-weight:900;font-size:clamp(20px,calc(24px*var(--u)),30px);font-variant-numeric:tabular-nums}
.es{font-weight:700;font-size:clamp(15px,calc(16px*var(--u)),20px);line-height:1.3}
.emvp,.erec{font-weight:900;font-size:clamp(13px,calc(14px*var(--u)),17px);color:#c9d6ff}
.eact{display:flex;flex-direction:column;align-items:center;gap:max(12px,calc(14px*var(--u)))}
#end.in .eact{animation:fadein 1.1s steps(6)}@keyframes fadein{0%,70%{opacity:0}100%{opacity:1}}
#loader{position:fixed;inset:0;background:#05070f;display:flex;align-items:center;justify-content:center;z-index:9;font-weight:900;font-size:22px;letter-spacing:.1em;color:#ffd23f;transition:opacity .3s}
#loader.gone{opacity:0;pointer-events:none}
#tune{position:absolute;right:0;top:120px;max-height:60vh;overflow:auto;background:rgba(0,0,0,.85);padding:8px;font-size:12px;display:flex;flex-direction:column;gap:4px;z-index:5}
#tune label{display:flex;justify-content:space-between;gap:8px}#tune input{width:70px}
@media (orientation:landscape) and (max-height:520px){
  #title{justify-content:center;flex-direction:row;flex-wrap:wrap;gap:20px}#logo{width:min(46vw,420px);margin-top:0}.tbtns{margin:0}
  .panel{width:min(70vw,640px)}.pcg{grid-template-columns:repeat(6,1fr)}.pcg.def{grid-template-columns:repeat(4,1fr)}.pcv{max-width:80px}
  .ecwrap{flex-direction:row}#banner{top:30%}
}
</style>
</head>
